# Routine version updates for the development toolchain and the workflow
# actions: once a month, grouped, so a month brings at most three pull requests.
# Security updates are separate: GitHub opens those as soon as an advisory is
# published, whatever this file says.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Propose a release only once it is a week old, so a broken or compromised
    # one is usually caught first. Security updates are not delayed.
    cooldown:
      default-days: 7
    groups:
      # A Playwright update changes the browsers, so the visual baselines
      # usually need regenerating on its branch: it gets its own pull request.
      playwright:
        patterns:
          - "@playwright/test"
      dev-tools:
        patterns:
          - "*"
        exclude-patterns:
          - "@playwright/test"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
