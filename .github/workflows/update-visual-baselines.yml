name: Update visual baselines

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visual-baselines-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    name: Regenerate Win32 visual baselines
    if: github.ref != 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:visual:update
      - name: Commit changed baselines to the dispatched branch
        shell: bash
        run: |
          git add tests/visual
          if git diff --cached --quiet; then
            echo "The committed baselines already match."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate Win32 visual baselines for ${GITHUB_SHA::7}"
          git push
