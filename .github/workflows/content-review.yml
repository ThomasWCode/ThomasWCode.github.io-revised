name: Content review

on:
  schedule:
    - cron: "0 7 1 * *"
  workflow_dispatch:
    inputs:
      today:
        description: "Review as if today were this date (YYYY-MM-DD). Leave empty for today."
        required: false
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: content-review
  cancel-in-progress: false

jobs:
  review:
    name: Flag copy that is due for a re-read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Build the review report
        env:
          REVIEW_DATE: ${{ inputs.today }}
        shell: bash
        run: |
          if [ -n "$REVIEW_DATE" ]; then
            node scripts/content-review.mjs "--today=$REVIEW_DATE" > report.md
          else
            node scripts/content-review.mjs > report.md
          fi
          cat report.md
      # A new issue each month something is due. A second run in the same month
      # leaves that month's issue as it is (its report stays in the run's log).
      # The other review issues still open are closed with a link to it, their
      # bodies and ticked boxes as they were, and only once it exists.
      - name: Open this month's content review issue and close the previous one
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_DATE: ${{ inputs.today }}
        shell: bash
        run: |
          if [ ! -s report.md ]; then
            echo "Nothing is due for review."
            exit 0
          fi
          month=$(date -u -d "${REVIEW_DATE:-now}" +'%B %Y')
          title="Content review: $month"
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title,url \
            --jq '[.[] | select(.title | startswith("Content review:"))] | sort_by(.number)')
          url=$(jq -r --arg title "$title" '[.[] | select(.title == $title)][0].url // empty' <<< "$open")
          if [ -n "$url" ]; then
            echo "This month's review issue is open already, and left as it is: $url"
          else
            url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file report.md)
            echo "Opened $url"
          fi
          for number in $(jq -r --arg url "$url" '.[] | select(.url != $url) | .number' <<< "$open"); do
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Replaced by $url, this month's review. This issue is left as it was."
            echo "Closed issue #$number"
          done
